volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_redis_data: {}
  production_minio_data: {}

x-django-base: &django-base
  build:
    context: .
    dockerfile: ./compose/production/django/Dockerfile
  env_file:
    - ./.envs/.production/.django
    - ./.envs/.production/.postgres

services:
  django: &django
    <<: *django-base
    image: core_production_django
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: /start

  migrate:
    <<: *django-base
    image: core_production_migrate
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    command: python manage.py migrate

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: core_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: core_production_traefik
    depends_on:
      - django
      - minio
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:5555:5555'

  redis:
    image: docker.io/redis:8.10
    volumes:
      - production_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_minio_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        export MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        export MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data --console-address ":$${S3_CONSOLE_PORT:-9001}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mc:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./.envs/.production/.django
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set prod http://minio:9000 \
          "$$S3_ACCESS_KEY_ID" \
          "$$S3_SECRET_ACCESS_KEY"

        mc mb --ignore-existing "prod/$$S3_BUCKET"

  celeryworker:
    <<: *django
    image: core_production_celeryworker
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: core_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: core_production_flower
    command: /start-flower

  awscli:
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z

[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=80" ]

[project]
name = "core"
version = "0.1.0"
description = "Behold My Awesome Project!"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "oddegen", email = "oddegen@api.kelem.app" } ]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "certifi>=2026.4.22",
  "channels==4.3.2",
  "channels-redis==4.3.0",
  "collectfasta==3.3.3",
  "crispy-bootstrap5==2026.3",
  "cryptography>=48.0.1",
  "django==6.0.6",
  "django-allauth[mfa]==65.18.0",
  "django-anymail[resend]==15.0",
  "django-celery-beat==2.9.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.6",
  "django-environ==0.13.0",
  "django-erd-generator==0.1.7",
  "django-filter>=25.2",
  "django-jazzmin>=3.0.4",
  "django-model-utils==5.0.0",
  "django-redis==6.0.0",
  "django-storages[s3]==1.14.6",
  "djangorestframework==3.17.1",
  "djangorestframework-simplejwt>=5.5.1",
  "djoser>=2.3.3",
  "drf-spectacular==0.29.0",
  "flower==2.0.1",
  "gunicorn==25.3.0",
  "hiredis==3.4.0",
  "httpx==0.28.1",
  "openpyxl",
  "pandas",
  "pillow==12.2.0",
  "psycopg[c]==3.3.4",
  "python-slugify==8.0.4",
  "redis==7.4.0",
  "uvicorn[standard]==0.49.0",
  "uvicorn-worker==0.4.0",
  "whitenoise==6.12.0",
]
scripts.backend-api-docs-mcp = "core.mcp_backend_docs.server:main"

[dependency-groups]
dev = [
  "coverage==7.14.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==6.3.0",
  "django-extensions==4.1",
  "django-seed>=0.3.1",
  "django-stubs[compatible-mypy]==6.0.5",
  "djangorestframework-stubs==3.17.0",
  "djlint==1.39.0",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==1.20.2",
  "mypy-boto3-s3>=1.43.5",
  "pre-commit==4.6.0",
  "psycopg[c]==3.3.4",
  "pytest==9.0.3",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.16",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

[tool.setuptools]
packages.find.include = [ "config*", "core*" ]

[tool.ruff]
# Exclude generated and agent-managed files.
extend-exclude = [ "*/migrations/*.py", ".agents/*", "agents/*", "staticfiles/*" ]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.per-file-ignores = { "apps/assessments/tests/test_api.py" = [ "PLR0913" ] }
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [ "mypy_django_plugin.main", "mypy_drf_plugin.main" ]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
ini_options.python_files = [ "tests.py", "test_*.py" ]

[tool.coverage]
# ==== Coverage ====
run.include = [ "core/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2
